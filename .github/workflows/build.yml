name: Build

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - run: bun test
      - name: Build & Lint
        if: matrix.os == 'ubuntu-latest'
        run: |
          bun run build
          bun run lint

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: log-dot-print-macos-arm64
          - os: macos-14
            target: bun-darwin-x64
            artifact: log-dot-print-macos-x64
          - os: windows-latest
            target: bun-windows-x64
            artifact: log-dot-print-windows-x64.exe
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build executable
        shell: bash
        run: |
          bun build --compile --minify --sourcemap \
            --external serialport \
            --external @serialport/* \
            --external escpos-usb \
            --external @printers/printers \
            --external playwright \
            --external playwright-core \
            --external pdf-to-printer \
            --target=${{ matrix.target }} \
            src/cli.ts --outfile=dist/${{ matrix.artifact }}

      - name: Copy UI assets
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          bun run build:ui
          cp -r dist/ui dist/ui-assets

      - name: Upload executable
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

      - name: Upload UI assets
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ui-assets-${{ matrix.os }}
          path: dist/ui-assets
          if-no-files-found: error
