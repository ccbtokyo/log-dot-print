<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/ui/" />
    <title>Log-Dot-Print Queue Manager</title>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <div id="app" class="app">
      <header class="header">
        <h1>Log-Dot-Print Queue Manager</h1>
      </header>
      <div id="status-bar"></div>
      <div id="tabs"></div>
      <div id="controls"></div>
      <div id="error-banner"></div>
      <main id="queue-view" class="main">
        <div id="queue-list"></div>
      </main>
      <main id="history-view" class="main" style="display: none">
        <div id="history-table"></div>
        <div id="pagination"></div>
      </main>
      <div id="preview-modal"></div>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
